services:
  postgres-db:
    image: postgres:15
    container_name: facturacion_db_container
    environment:
      POSTGRES_USER: postgres      # mismo usuario que application.properties
      POSTGRES_PASSWORD: "1234"    # misma clave que application.properties
      POSTGRES_DB: underBase
      TZ: America/Argentina/Buenos_Aires    # <-- Agregamos esto
    ports:
      - "5432:5432"
    restart: unless-stopped