# ===== Conexión a PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/underBase
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Hibernate / JPA =====
# Esquema por defecto para todas las entidades
spring.jpa.properties.hibernate.default_schema=modeloventas
# Crea el esquema modeloventas si no existe (no hace falta crearlo a mano):
# Spring ejecuta src/main/resources/schema.sql antes de que Hibernate cree las tablas
spring.sql.init.mode=always

# Recrea las tablas en cada arranque y las borra al cerrar
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===== JSON (Parte 3) =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# --- ARCA (homologación) ---
# Si no estan definidas (PC sin certificado de ARCA), la app arranca igual y solo fallan
# las funciones de ARCA (facturar / anular en ARCA) con un mensaje que lo explica.
arca.cuit=${ARCA_CUIT:0}
arca.key-path=${ARCA_KEY_PATH:}
arca.cert-path=${ARCA_CERT_PATH:}
arca.punto-venta=${ARCA_PTO_VTA:1}
arca.wsaa-url=https://wsaahomo.afip.gov.ar/ws/services/LoginCms
arca.wsfe-url=https://wswhomo.afip.gov.ar/wsfev1/service.asmx